# Runs the published images from GitHub Container Registry instead of building locally.
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
# GHCR_OWNER must be lowercase (e.g. marbi8891). IMAGE_TAG defaults to latest.
services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-marbi8891}/nexaro-hub-backend:${IMAGE_TAG:-latest}
    build: !reset null
  frontend:
    image: ghcr.io/${GHCR_OWNER:-marbi8891}/nexaro-hub-frontend:${IMAGE_TAG:-latest}
    build: !reset null
