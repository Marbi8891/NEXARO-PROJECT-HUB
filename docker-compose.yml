name: nexaro-projects-hub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaro}
      POSTGRES_USER: ${POSTGRES_USER:-nexaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NEXARO_ENV: ${NEXARO_ENV:-production}
      NEXARO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexaro}
      NEXARO_SECRET_KEY: ${NEXARO_SECRET_KEY:?Set NEXARO_SECRET_KEY in .env}
      NEXARO_COOKIE_SECURE: ${NEXARO_COOKIE_SECURE:-false}
      NEXARO_SEED_INITIAL_PROJECTS: ${NEXARO_SEED_INITIAL_PROJECTS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HUB_PORT:-8080}:8080"

volumes:
  pgdata:
